<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Duotono</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@70..100,400..720&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">
    <header class="toolbar row">
      <div class="brand row" title="Duotono: pasá una foto a escala de grises y teñila con tintas planas">
        <svg class="brand-mark" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="5" fill="var(--text)" />
          <path d="M21.53 2.47 a5 5 0 01 1.47 3.53 v12a5 5 0 01-5 5H6 a5 5 0 01 -3.53 -1.47z" fill="var(--accent)" />
        </svg>
        <h1 class="brand-name">Duotono</h1>
      </div>
      <span class="tb-sep" aria-hidden="true"></span>
      <input type="file" id="file" accept="image/*" class="sr" />
      <button class="tbtn" id="openBtn" aria-label="Abrir imagen">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 10.5v-8M4.5 6L8 2.5 11.5 6M3 13.5h10" />
        </svg>
        <span class="tlabel">Abrir…</span>
      </button>
      <button class="hbtn center" id="undoBtn" aria-label="Deshacer">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5.5 3.5L2.5 6.5l3 3" />
          <path d="M2.5 6.5h7a4 4 0 010 8H7" />
        </svg>
      </button>
      <button class="hbtn center" id="redoBtn" aria-label="Rehacer">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.5 3.5l3 3-3 3" />
          <path d="M13.5 6.5h-7a4 4 0 000 8H9" />
        </svg>
      </button>
      <span class="tb-sep" aria-hidden="true"></span>
      <div class="file-info grow">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linejoin="round" aria-hidden="true">
          <rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5" />
          <path d="M1.75 11l3.5-3.5 3 3 2-2 4 4" />
          <circle cx="10.5" cy="5.75" r="1" />
        </svg>
        <span class="file-name truncate" id="fileName"></span>
        <span class="file-dims truncate tabular" id="fileDims"></span>
      </div>
      <div class="split dl-split">
        <div class="dl" role="group" aria-label="Descargas">
          <button id="expDuo" aria-label="Descargar duotono"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10" />
            </svg><span class="lbl">Descargar duotono</span></button>
          <button id="expMenuBtn" class="caret" aria-haspopup="menu" aria-expanded="false" aria-controls="expMenu"
            aria-label="Más opciones de descarga"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M4 6l4 4 4-4" />
            </svg></button>
        </div>
        <div class="menu" id="expMenu" role="menu" aria-label="Opciones de descarga" hidden>
          <button role="menuitem" tabindex="-1" data-action="gray">Descargar gris<small>PNG en escala de
              grises</small></button>
          <button role="menuitem" tabindex="-1" data-action="zip">Descargar todo<small>ZIP con el duotono y el
              gris</small></button>
        </div>
      </div>
    </header>

    <main class="stage-wrap">
      <div class="stage center" id="stage">
        <div class="seg view-seg" id="viewSeg" role="group" aria-label="Vista">
          <button data-v="original" aria-pressed="false">Original</button>
          <button data-v="gray" aria-pressed="false">Gris</button>
          <button data-v="result" aria-pressed="true">Resultado</button>
        </div>
        <div class="seg zoom-seg" id="zoomSeg" role="group" aria-label="Zoom">
          <button data-z="fit" aria-pressed="true"
            title="Ajustar a la vista (Ctrl+0). También con doble clic.">Ajustar</button>
          <button data-z="actual" aria-pressed="false"
            title="Tamaño real (Ctrl+1). También con doble clic.">100%</button>
        </div>
        <canvas id="view" aria-label="Vista previa"></canvas>
        <div class="empty center" id="emptyState">
          <button class="dropzone" id="dropzone" type="button">
            <span class="dz-icon center"><svg width="28" height="28" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M8 10.5v-8M4.5 6L8 2.5 11.5 6M3 13.5h10" />
              </svg></span>
            <span class="dz-title">Arrastrá una imagen o hacé clic para abrirla</span>
            <span class="dz-sub" id="dzSub">También podés pegarla con Ctrl+V · JPG, PNG o WebP</span>
          </button>
          <button class="link-btn" id="sampleBtn" type="button">o probá con una imagen de ejemplo</button>
        </div>
        <div class="toast truncate" id="toast" role="status" aria-live="polite"></div>
      </div>
    </main>

    <aside class="panel">
      <div class="panel-bar">
        <div class="bar-row row grow">
          <span class="bar-label" id="recipeLabel">Receta</span>
          <button class="recipe-btn grow" aria-describedby="recipeLabel" id="recipeBtn" aria-haspopup="menu"
            aria-expanded="false" aria-controls="recipeList">
            <span class="recipe-name grow truncate" id="recipeName"></span>
            <span class="recipe-dot" aria-hidden="true"></span>
            <svg class="recipe-chev" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6l4 4 4-4" />
            </svg>
            <span class="recipe-strip" id="recipeStrip" aria-hidden="true"></span>
          </button>
          <div class="split save-split">
            <div class="dl" role="group" aria-label="Guardar receta">
              <button id="recipeSave"><span class="lbl">Guardar</span></button>
              <button id="saveMenuBtn" class="caret" aria-haspopup="menu" aria-expanded="false" aria-controls="saveMenu"
                aria-label="Más opciones de guardado"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"
                  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true">
                  <path d="M4 6l4 4 4-4" />
                </svg></button>
            </div>
            <div class="menu" id="saveMenu" role="menu" aria-label="Opciones de guardado" hidden>
              <button role="menuitem" tabindex="-1" data-act="saveas">Guardar como…<small
                  id="saveAsHint">Ctrl+Shift+S</small></button>
              <button role="menuitem" tabindex="-1" data-act="export">Exportar a archivo…<small>.json para compartir o
                  respaldar</small></button>
            </div>
          </div>
        </div>
        <div class="menu recipe-list" id="recipeList" role="menu" aria-label="Recetas" hidden>
          <!-- Las filas salen de #recipeRowTpl (recipes.js) -->
          <div class="rgroup">Mis recetas</div>
          <div id="recipesMine"></div>
          <p class="rempty" id="recipesEmpty">Todavía no guardaste recetas. Usá Guardar o importá un archivo.</p>
          <div class="rgroup">Predeterminadas</div>
          <div id="recipesBuiltin"></div>
          <div class="rfoot">
            <button role="menuitem" tabindex="-1" data-op="import"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>Importar…</button>
            <button role="menuitem" tabindex="-1" data-op="exportall" id="recipesExportAll"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 10.5v-8M4.5 6L8 2.5 11.5 6M3 13.5h10"/></svg>Exportar mis recetas</button>
          </div>
        </div>
        <input type="file" id="recipeImport" accept=".json,application/json" class="sr" />
      </div>
      <section class="block">
        <div class="block-head row"><span class="num center tabular">1</span>
          <h2>Conversión a gris</h2>
        </div>
        <select id="grayMode" aria-label="Método de conversión">
          <option value="lum">Luminancia perceptual (L*)</option>
          <option value="mix">Mezclador de canales</option>
        </select>
        <div id="mixer" class="mix" hidden>
          <div class="sublabel">Filtro</div>
          <div class="filters" id="filters">
            <button class="btn" data-mix="21.26,71.52,7.22">Neutro</button>
            <button class="btn" data-mix="90,10,0">Rojo</button>
            <button class="btn" data-mix="70,40,-10">Naranja</button>
            <button class="btn" data-mix="10,90,0">Verde</button>
            <button class="btn" data-mix="0,20,80">Azul</button>
          </div>
          <div class="sublabel">Canales</div>
          <div class="field"><label for="mr">R</label><input type="range" id="mr" min="-50" max="200" step="1" /><output class="tabular"
              id="mro"></output></div>
          <div class="field"><label for="mg">G</label><input type="range" id="mg" min="-50" max="200" step="1" /><output class="tabular"
              id="mgo"></output></div>
          <div class="field"><label for="mb">B</label><input type="range" id="mb" min="-50" max="200" step="1" /><output class="tabular"
              id="mbo"></output></div>
          <p class="hint" id="mixTotal"></p>
        </div>
        <canvas id="grayHist" class="hist" aria-label="Histograma de niveles de gris" title="Arrastrá los marcadores para elegir el negro y el blanco. Doble clic: rango completo." hidden></canvas>
      </section>

      <section class="block">
        <div class="block-head row"><span class="num center tabular">2</span>
          <h2>Tintas</h2>
          <button class="btn add" id="addInk"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M8 3v10M3 8h10" />
            </svg>Agregar tinta</button>
        </div>
        <div id="inks"></div>
      </section>
    </aside>
  </div>

  <!-- Fila de la lista de recetas. Las predeterminadas no llevan .ricons (no se renombran ni eliminan) -->
  <template id="recipeRowTpl">
    <div class="rrow">
      <button role="menuitemradio" aria-checked="false" tabindex="-1" class="ritem">
        <span class="rname truncate"></span><span class="rstrip"></span>
      </button>
      <span class="ricons">
        <button role="menuitem" tabindex="-1" class="ricon" data-op="rename" title="Renombrar">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>
        </button>
        <button role="menuitem" tabindex="-1" class="ricon danger" data-op="delete" title="Eliminar">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9"/></svg>
        </button>
      </span>
    </div>
  </template>

  <!-- Tarjeta de una tinta (ui-inks.js la clona y la completa: colores rápidos y curvas salen de los datos) -->
  <template id="inkCardTpl">
    <div class="ink">
      <div class="ink-head">
        <label class="swatch head-swatch" title="Elegir color"><input type="color" class="c-main" aria-label="Color de la tinta"></label>
        <input type="text" class="name" aria-label="Nombre de la tinta">
        <input type="text" class="hex hex-main tabular" spellcheck="false" autocomplete="off"
          title="Hex, rgb(), hsl(), oklch() o cualquier color CSS" aria-label="Color de la tinta: hex, rgb(), hsl(), oklch() o cualquier color CSS">
        <button class="icon-btn rm" title="Quitar tinta" aria-label="Quitar tinta">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="seg ink-mode" role="group" aria-label="Tipo de color">
        <button data-mode="solid" aria-pressed="true">Color fijo</button>
        <button data-mode="gradient" aria-pressed="false">Degradé</button>
      </div>
      <div class="grad-row" hidden>
        <div class="grad-end" data-end="color">
          <span class="end-label">Blancos</span>
          <label class="swatch sm" title="Color en los blancos"><input type="color" class="c-end" aria-label="Color en los blancos"></label>
          <input type="text" class="hex hex-end tabular" spellcheck="false" autocomplete="off"
            title="Hex, rgb(), hsl(), oklch() o cualquier color CSS" aria-label="Color en los blancos: hex, rgb(), hsl(), oklch() o cualquier color CSS">
        </div>
        <span class="grad-arrow" aria-hidden="true">→</span>
        <div class="grad-end" data-end="color2">
          <span class="end-label">Negros</span>
          <label class="swatch sm" title="Color en los negros"><input type="color" class="c-end" aria-label="Color en los negros"></label>
          <input type="text" class="hex hex-end tabular" spellcheck="false" autocomplete="off"
            title="Hex, rgb(), hsl(), oklch() o cualquier color CSS" aria-label="Color en los negros: hex, rgb(), hsl(), oklch() o cualquier color CSS">
        </div>
        <span class="grad-strip" aria-hidden="true"></span>
      </div>
      <div class="chips"></div>
      <div class="curve-box">
        <canvas class="curve" aria-label="Curva de la tinta. Hacé clic para agregar puntos, arrastralos para ajustar y doble clic para quitarlos."></canvas>
        <span class="readout tabular" aria-hidden="true"></span>
      </div>
      <div class="curve-foot">
        <span>Curva</span>
        <select class="preset" aria-label="Curva">
          <option value="custom" disabled>Personalizada</option>
        </select>
        <button class="icon-btn flip-x" title="Espejar en X: intercambia luces y sombras" aria-label="Espejar la curva horizontalmente">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5v13" stroke-dasharray="1.6 1.6"/><path d="M5.5 4L1.5 12h4z" fill="currentColor"/><path d="M10.5 4l4 8h-4z"/></svg>
        </button>
        <button class="icon-btn flip-y" title="Espejar en Y: invierte la cantidad de tinta" aria-label="Espejar la curva verticalmente">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 8h13" stroke-dasharray="1.6 1.6"/><path d="M4 5.5L12 1.5v4z" fill="currentColor"/><path d="M4 10.5l8 4v-4z"/></svg>
        </button>
      </div>
    </div>
  </template>

  <dialog id="dlg" class="dlg" aria-labelledby="dlgTitle">
    <form method="dialog">
      <h3 id="dlgTitle"></h3>
      <p id="dlgMsg"></p>
      <label id="dlgField"><span id="dlgLabel"></span><input id="dlgInput" type="text" autocomplete="off" /></label>
      <div class="dlg-actions">
        <button class="btn" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn primary" value="ok" id="dlgOk"></button>
      </div>
    </form>
  </dialog>

  <!-- Punto de entrada: main.ts importa el resto de los módulos -->
  <script type="module" src="js/main.ts"></script>
</body>

</html>
